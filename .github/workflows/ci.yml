name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # GitHub hosts no Fedora runners, so run the job inside a Fedora 44
    # container on the Ubuntu host.
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      # The Fedora base image ships neither a toolchain nor git nor python3
      # (dnf5 is C++). Install before checkout so actions/checkout finds git
      # and does a real clone instead of the REST-API tarball fallback.
      - name: Install build dependencies
        run: dnf install -y gcc gcc-c++ make git python3

      - uses: actions/checkout@v4

      - name: Clone XED and mbuild
        run: |
          git clone https://github.com/intelxed/xed.git xed
          git clone https://github.com/intelxed/mbuild.git mbuild

      - name: Build XED
        run: cd xed && ./mfile.py install --install-dir=kits/xed-install

      - name: Build x86lint
        run: XED_PATH=${PWD}/xed make all

      - name: Run tests
        run: XED_PATH=${PWD}/xed make check
